services:
  backend:
    build:
      context: ./backend/safe
    image: sna-devsecops-safe-backend:local
    container_name: sna-devsecops-backend
    environment:
      APP_ADDR: ":8080"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: sna-devsecops-frontend:local
    container_name: sna-devsecops-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
